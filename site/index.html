<style>
/* Layout: papan taktik biru malam; padang 2D hijau semasa perlawanan. Bar atas melekit, rel navigasi kiri, panel data; padang taktik untuk formasi; perlawanan sebagai lapisan penuh. */
:root{
  --bg:#0a1630; --panel:#0f1f40; --panel-2:#152a54; --line:#22396b; --fg:#e8eefb; --mute:#93a6cc;
  --accent:#4f8cff; --accent-ink:#ffffff; --hot:#ffc947; --hot-ink:#1f1600;
  --win:#4fd18b; --loss:#ff6b5e; --info:#7cc4ff; --board:#06102a;
  --pitch:#0c2756; --pitch-2:#0e2d63; --pitch-line:rgba(190,215,255,.42);
  --c-L:#4f8cff; --c-FA:#ff9f43; --c-TB:#2dd4bf; --c-SB:#ffc947; --c-FR:#93a6cc; --c-AC:#b18cff; --c-AL:#ff7ac6; --c-AS:#e879f9;
  --g:#ffc947; --d:#7cc4ff; --m:#6fe0a6; --a:#ff8a7a;
  --f-display:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.55rem}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.mute{color:var(--mute)}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.club-id{display:flex;align-items:center;gap:10px;min-width:0}
.club-id .cname{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1}
.club-id .sub{font-size:.8rem;color:var(--mute)}
.when{flex:1;min-width:230px;font-size:.88rem}
.when .date{font-family:var(--f-display);font-size:1.15rem;font-weight:600;line-height:1.1}
.when b{color:var(--info);font-weight:600}
.money{text-align:right;font-size:.82rem}
.money b{display:block;font-family:var(--f-mono);font-size:1rem}
.tw{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tw.on{border-color:var(--win);color:var(--win)}
.kit{display:inline-block;width:14px;height:14px;border-radius:3px;flex:none;vertical-align:-2px;
  background:linear-gradient(135deg,var(--k1) 50%,var(--k2) 50%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.kit.lg{width:30px;height:30px;border-radius:6px}

.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 22px}
.btn.primary:hover{filter:brightness(1.1)}
.btn.good{border-color:var(--win);color:var(--win)}
.btn.bad{border-color:var(--loss);color:var(--loss)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{font-family:var(--f-mono);width:150px}
.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.link:hover{color:var(--info);text-decoration:underline;text-underline-offset:3px}

.shell{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 64px)}
nav.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
nav.rail button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:6px}
nav.rail button:hover{color:var(--fg);background:var(--panel-2)}
nav.rail button.on{color:var(--accent-ink);background:var(--accent)}
nav.rail .badge{background:var(--hot);color:var(--hot-ink);font-family:var(--f-mono);font-size:.7rem;border-radius:999px;padding:0 6px}
nav.rail .spacer{flex:1;min-height:20px}
main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view{display:flex;flex-direction:column;gap:20px;max-width:1240px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.banner{border:1px solid var(--line);border-left:4px solid var(--win);background:var(--panel-2);border-radius:6px;padding:10px 14px;font-size:.92rem}
.banner.off{border-left-color:var(--mute)}
.banner.warn{border-left-color:var(--hot)}

.tbl{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid rgba(34,57,107,.65);white-space:nowrap}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
tr.me td{background:var(--panel-2)}
tr.me td.nm{color:var(--info);font-weight:700}
tr.dim td{opacity:.5}
tr.cut td{border-bottom:1px dashed var(--info)}
tr.xi td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.nm{font-weight:600}

.pos{font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.pos.g{color:var(--g)} .pos.d{color:var(--d)} .pos.m{color:var(--m)} .pos.a{color:var(--a)}
.alt{font-family:var(--f-mono);font-size:.7rem;color:var(--mute)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.7rem;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.chip.cc{color:var(--cc);border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--panel-2))}
.chip.lab{font-size:.6rem;padding:0 4px;margin-left:4px;vertical-align:1px}
.c-L{--cc:var(--c-L)}.c-FA{--cc:var(--c-FA)}.c-TB{--cc:var(--c-TB)}.c-SB{--cc:var(--c-SB)}.c-FR{--cc:var(--c-FR)}.c-AC{--cc:var(--c-AC)}.c-AL{--cc:var(--c-AL)}.c-AS{--cc:var(--c-AS)}
.wk.k-L,.wk.k-FA,.wk.k-TB,.wk.k-SB,.wk.k-FR,.wk.k-AC,.wk.k-AL,.wk.k-AS{box-shadow:inset 3px 0 0 var(--cc)}
.chip.inj{color:var(--loss);border-color:var(--loss)}
.chip.ban{color:var(--hot);border-color:var(--hot)}
.chip.imp{color:var(--info);border-color:transparent;background:none;padding:0 2px}
.chip.sale{color:var(--win);border-color:var(--win)}
.chip.ctr{color:var(--hot);border-color:transparent;background:none;padding:0}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;font-family:var(--f-mono);font-size:.68rem;font-weight:600;width:17px;height:17px;display:inline-grid;place-items:center;border-radius:3px;color:#081226}
.form i.M{background:var(--win)} .form i.S{background:var(--mute)} .form i.K{background:var(--loss)}
.fbar{display:inline-block;width:84px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}.fbar i{display:block;height:100%;background:var(--win)}
.rolec{display:inline-block;font-family:var(--f-mono);font-size:.62rem;font-weight:700;padding:0 4px;border-radius:3px;background:var(--hot);color:var(--hot-ink);margin-left:3px;vertical-align:1px}
.rlgrid td{vertical-align:middle}.rlgrid .rld{font-size:.8rem;color:var(--mute);max-width:46ch}
.famlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin-top:6px}.famlist div{display:flex;align-items:center;justify-content:space-between;font-size:.86rem;gap:6px}
.att{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:center}
.att.hi{color:var(--hot);font-weight:600} .att.lo{color:var(--mute)}
.bar{display:block;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.cond{display:inline-block;width:46px;vertical-align:middle}
.cond .bar>span{background:var(--win)} .cond.warn .bar>span{background:var(--hot)} .cond.bad .bar>span{background:var(--loss)}
select.place{padding:3px 4px;font-family:var(--f-mono);font-size:.8rem;min-width:80px}
select.place.on{border-color:var(--accent);color:var(--fg);background:var(--panel-2)}
select.place.sub{border-color:var(--info);color:var(--info)}

/* pitch */
.sq-top{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:8px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%);border:1px solid var(--line)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pitch svg.lines *{fill:none;stroke:var(--pitch-line);stroke-width:.35}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;width:92px;text-align:center;pointer-events:none}
.mk .dot{pointer-events:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(135deg,var(--k1) 50%,var(--k2) 50%);border:2px solid var(--win);box-shadow:0 2px 6px rgba(0,0,0,.45);padding:0}
.mk .dot span{font-family:var(--f-mono);font-size:.62rem;font-weight:600;background:rgba(6,16,42,.85);color:var(--fg);padding:0 3px;border-radius:3px}
.mk.f2 .dot{border-color:var(--hot)} .mk.f3 .dot{border-color:var(--loss)} .mk.empty .dot{background:rgba(6,16,42,.6);border:2px dashed var(--mute)}
.mk .mn{font-size:.72rem;font-weight:600;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
.mk .mr{font-family:var(--f-mono);font-size:.66rem;color:var(--mute);text-shadow:0 1px 2px #000}
.pitch.sm .mk{width:76px}.pitch.sm .mk .dot{width:26px;height:26px}.pitch.sm .mk .mn{font-size:.66rem;max-width:76px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;margin-right:4px;vertical-align:-1px}

/* start */
.start{max-width:1100px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.masthead{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:14px}
.masthead h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.masthead h1 span{color:var(--accent)}
.masthead p{color:var(--mute);max-width:64ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.ccard:hover{border-color:var(--mute)} .ccard.sel{border-color:var(--accent);background:var(--panel-2)}
.ccard .t{display:flex;gap:10px;align-items:center}
.ccard .n{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1}
.ccard .k{font-size:.82rem;color:var(--mute)}
.stars{color:var(--hot);letter-spacing:2px;font-size:.9rem}
.st5{white-space:nowrap;font-size:.74rem;line-height:1;display:inline-block;vertical-align:1px;flex:none;letter-spacing:0}.st5 i{font-style:normal;color:var(--hot)}.st5 i.q{opacity:.45}.st5 i.e{color:var(--mute);opacity:.35}.st5.lg{font-size:1.3rem;vertical-align:-2px}.mk .mr .st5{font-size:.74rem;vertical-align:-1px}.smk .ms{line-height:1;text-shadow:0 1px 2px #000}.smk .ms .st5{font-size:.5rem}.nmx.fx{display:flex;align-items:center;gap:5px}.nmx.fx .nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.stleg{font-size:.8rem;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip.tg{font-family:var(--f-mono);font-weight:700;font-size:.64rem;padding:0 4px;letter-spacing:.02em;line-height:1.55;white-space:nowrap;vertical-align:1px}.chip.tg small{font-weight:500;margin-left:3px;opacity:.9;font-size:.95em}
.chip.tg.r{color:#fff;background:var(--loss);border-color:var(--loss)}.chip.tg.g{color:#062012;background:var(--win);border-color:var(--win)}.chip.tg.a{color:var(--hot);border-color:var(--hot)}.chip.tg.b{color:var(--info);border-color:var(--info)}
.mk .mr .chip.tg{font-size:.56rem;padding:0 3px;text-shadow:none}.nmx.fx .chip.tg{flex:none}
@media (min-width:861px){.nlbadge .mx-ctl{padding-right:230px}}
.nlbadge .modal-bg{padding-bottom:90px}
.wrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.wk{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);min-height:112px;font-size:.82rem;min-width:0;scroll-snap-align:start}
.wk.cur{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}.wk.off{opacity:.62}.wk.cur.off{opacity:1}
.wk .wd{font-family:var(--f-mono);font-size:.72rem;color:var(--mute)}.wtop{display:flex;gap:6px;align-items:center}
.wopp{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600}.wopp .link{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-align:left}
.wha{font-family:var(--f-mono);font-weight:700;font-size:.72rem;padding:1px 6px;border-radius:4px;display:inline-block;width:fit-content}.wha.H{background:rgba(52,211,153,.18);color:var(--win)}.wha.A{background:rgba(148,163,184,.2);color:var(--fg)}.wha.N{background:rgba(250,204,21,.18);color:var(--hot)}
.wres{font-family:var(--f-mono);font-weight:700;font-size:.8rem;text-align:left}.wres.M{color:var(--win)}.wres.K{color:var(--loss)}.wres.S{color:var(--mute)}
.view.homev{max-width:1680px}.homegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}.hmain{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (min-width:1560px){.homegrid{grid-template-columns:minmax(0,1240px) minmax(300px,400px)}.hside{position:sticky;top:12px}}
.hstats{display:flex;flex-direction:column;gap:10px}.hslist{display:flex;flex-direction:column;gap:4px}
.hsrow{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;text-align:left;color:var(--fg);font-size:.84rem;font-family:inherit}.hsrow:hover{border-color:var(--mute)}
.hso{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hst{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}.hst b{font-size:1.2rem}.hst .mute{font-size:.74rem}
.hsps{display:flex;flex-direction:column;gap:6px}.hsp{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.86rem}.hsp>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frlist{display:flex;flex-direction:column;gap:8px}

.fropt.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:rgba(79,140,255,.12)}
.frck{width:22px;height:22px;border:1px solid var(--mute);border-radius:5px;display:grid;place-items:center;font-weight:700;color:var(--accent)}.fropt.on .frck{border-color:var(--accent)}
.frd,.frc,.frx{display:flex;flex-direction:column;gap:4px;min-width:0}.frd b{font-size:.86rem}.frc .mute{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frx{align-items:flex-end}
@media (max-width:620px){.fropt{grid-template-columns:24px minmax(0,1fr)}.fropt .frd{flex-direction:row;align-items:center;gap:8px}.fropt .frc,.fropt .frx{grid-column:2}.frx{align-items:center;flex-direction:row;flex-wrap:wrap;gap:8px}.hsp{grid-template-columns:100px minmax(0,1fr) auto}}
.frcall{border-color:var(--hot)}
.shbox{gap:10px;align-items:center;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}.shbox select{max-width:240px}
.cinfo{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.cinfo .panel{gap:10px}
.ciprow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.88rem;padding:3px 0}
.sbig{display:flex;align-items:baseline;gap:8px}.sbig b{font-size:2.6rem;line-height:1;color:var(--hot)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0}

/* home & money */
.nextcard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.nextcard .side{display:flex;flex-direction:column;align-items:center;gap:6px}

function wireCode(go,again){const f=document.getElementById('pkgate');if(!f)return;const el=document.getElementById('pkcode');
  f.addEventListener('submit',async e=>{e.preventDefault();const c=norm(el.value);if(!c)return again('Format kod tidak betul. Kod ada 8 huruf atau nombor selepas PK.');
    if(!window.crypto||!crypto.subtle)return again('Pelayar ini tidak menyokong pengesahan kod. Buka game melalui pautan https dalam Chrome, Edge atau Safari terkini.');

    activate(go,c,adm)})}

function activate(go,code,adm){set(LS.inv,JSON.stringify({code,adm:adm?1:0,at:new Date().toISOString()}));

function revoked(go,msg){screen(`<section class="panel"><h3>Akses dibatalkan</h3><p class="mute">Akses beta pada peranti ini tidak lagi aktif. Hubungi penganjur beta jika kau rasa ini satu kesilapan.</p></section>${codeForm(msg,true)}`);

async function fetchCfg(){try{const r=await fetch('beta.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return null;const j=await r.json();
  const l=(j.blocked||[]).map(x=>norm(x)||String(x).trim().toLowerCase()).filter(Boolean);set(LS.blk,JSON.stringify(l));return j}catch(e){return null}}

function famR(rk){if(!S||!S.fam||!S.fam.R)return 100;const v=S.fam.R[rk];return v==null?FAM0_R:v}

  return(rawRating(p,pos)+dev*rho-.6*(1-f/100))*roleSyn(rk,t)*fam(p,pos)}

function addFx(comp,round,h,a,extra){const id='f'+(S.nextF++);S.fixtures[id]=Object.assign({id,comp,round:String(round),t:tIndex(comp,round),h,a,played:false,hg:0,ag:0},extra||{});return id}
function roundRobin(ids){const t=ids.slice();if(t.length%2)t.push(null);const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!=null&&b!=null)pairs.push((r+i)%2===0?[a,b]:[b,a])}rounds.push(pairs);t.splice(1,0,t.pop())}return rounds}
function balanceHA(rounds,ids){let best=null,bv=1e9;
  for(let att=0;att<80;att++){const st={},hc={};ids.forEach(id=>{st[id]='';hc[id]=0});
    const R1=rounds.map(prs=>prs.map(([a,b])=>{const sc=(h,w)=>{let v=0;if(st[h].endsWith('HH'))v+=100;if(st[w].endsWith('AA'))v+=100;if(st[h].endsWith('H'))v+=3;if(st[w].endsWith('A'))v+=3;return v+(hc[h]-hc[w])*1.5+R()*.8};
      const o=sc(a,b)<=sc(b,a)?[a,b]:[b,a];st[o[0]]+='H';st[o[1]]+='A';hc[o[0]]++;return o}));
    let bad=0;for(const id of ids){const seq=st[id]+st[id].replace(/H/g,'x').replace(/A/g,'H').replace(/x/g,'A');const m=seq.match(/H{3,}|A{3,}/g);if(m)bad+=m.reduce((t,x)=>t+x.length-2,0)}
    if(bad<bv){bv=bad;best=R1}if(!bad)break}
  return best}

  const ch=h.ch[1];let a=h.FA;if(!ex(a)||a===ch)a=h.tables[1].find(id=>id!==ch&&ex(id));
  return ex(ch)&&ex(a)?[ch,a]:null}

// ---------- lineups

let BASE_CH=0.113;
function mkEntry(id,pos,min,x,y){const p=S.players[id];return{id,pos,x,y,rk:null,rf:100,si:null,cond:p.cond,yel:0,red:false,off:false,g:0,as:0,sv:0,ga:0,inj:false,in:min,out:null,sp:pos,sx:x,sy:y}}

function isDerby(fx){const a=fx&&S.clubs[fx.h],b=fx&&S.clubs[fx.a];return !!(a&&b&&a.state&&a.state===b.state&&fx.comp!=='FR')}

  if(fx.oppMot&&m.userSide>=0)m.sides[1-m.userSide].day*=1+fx.oppMot;const hc=S.clubs[fx.h];m.venue=m.neutral?NEUTRAL_VENUE:hc.stadium;
  if(fx.comp==='FR')m.banned=[];const dm=m.neutral?null:fx.comp==='FR'?frAtt(hc,fx.a,R()):demand(hc,fx);m.att=m.neutral?ri(38,82)*1000+ri(0,999):dm!=null?Math.round(Math.min(hc.cap,dm)):Math.round(hc.cap*clamp((fx.comp==='L'?.12:.2)+.05*rep(hc)+R()*.15+(hc.tier===0?.35:0),.08,1));

function clockLabel(m){if(m.phase==='PRE')return"0'";if(m.phase==='PEN')return'PEN';return m.extra?`${m.min}+${m.extra}'`:`${m.min}'`}

function profile(m,s){const sd=m.sides[s];let D=0,M=0,A=0,G=0;const tt=sd.tac?Object.assign({},sd.tac,{ment:sd.ment}):null;

  if(!G)G=4;let att=A/BW[2],def=D/BW[0],mid=M/BW[1];{const fm=famMul(m,s);att*=fm;def*=fm;mid*=fm}

const AWG={GK:'g',CB:'d',RB:'d',LB:'d',RWB:'d',LWB:'d',DM:'m',CM:'m',AM:'m',RM:'m',LM:'m',RWF:'a',LWF:'a',CF:'a'};
function bestXI(rows){// rows: [pid, score, pos, extra...]
  const need={g:1,d:4,m:3,a:3};const pickd=[];const used=new Set();const sorted=rows.slice().sort((a,b)=>b[1]-a[1]);
  for(const g of ['g','d','m','a']){for(const r of sorted){if(need[g]<=0)break;if(used.has(r[0])||AWG[r[2]]!==g)continue;pickd.push(r);used.add(r[0]);need[g]--}}
  for(const r of sorted){if(pickd.length>=11)break;if(!used.has(r[0])&&AWG[r[2]]!=='g'){pickd.push(r);used.add(r[0])}}
  const order={g:0,d:1,m:2,a:3};return pickd.sort((a,b)=>order[AWG[a[2]]]-order[AWG[b[2]]])}
function totwFor(t){const e=S.tl[t];if(!e||!e.c||e.c[0]!=='L')return;const r=e.c[1];
  [1,2,3].forEach(l=>{const rows=[];fixturesAt(t).filter(f=>f.comp==='L'&&f.lg===l&&f.played).forEach(f=>f.rt.forEach((side,s)=>side.forEach(x=>{if((x[5]||0)<60)rows.push([x[0],x[1],x[2],s?f.a:f.h])})));
    if(!rows.length)return;const xi=bestXI(rows);S.aw.totw[l].push({r,xi:xi.map(x=>[x[0],x[1],x[2],x[3]])});
    if(S.user&&l===S.clubs[S.user].tier){const mine=xi.filter(x=>x[3]===S.user);if(mine.length)inbox('award',`Team of the Week, Pusingan ${r}`,`${mine.map(x=>S.players[x[0]]?S.players[x[0]].name:'?').join(', ')} dipilih dalam Team of the Week ${LG_NAME[l]}.`,{links:[['awards','Lihat papan Team of the Week']]})}})}

function monthAwards(mk){
  [1,2,3].forEach(l=>{const fx=Object.values(S.fixtures).filter(f=>f.comp==='L'&&f.lg===l&&f.played&&monthKey(dateOfT(f.t))===mk);if(fx.length<10)return;
    const P={};fx.forEach(f=>f.rt.forEach((side,s)=>side.forEach(x=>{const k=x[0];const o=P[k]||(P[k]={ap:0,rt:0,g:0,as:0,c:s?f.a:f.h});o.ap++;o.rt+=x[1];o.g+=x[3];o.as+=x[4]})));
    const rounds=new Set(fx.map(f=>f.round)).size;const minAp=Math.max(1,Math.ceil(rounds*.6));
    let best=null,bv=-1;Object.entries(P).forEach(([id,o])=>{if(o.ap<minAp)return;const v=o.rt/o.ap+.12*o.g+.05*o.as;if(v>bv){bv=v;best=[id,o]}});
    const C={};fx.forEach(f=>{[[f.h,f.hg,f.ag],[f.a,f.ag,f.hg]].forEach(([c,gf,ga])=>{const o=C[c]||(C[c]={p:0,gd:0,n:0});o.n++;o.gd+=gf-ga;o.p+=gf>ga?3:gf===ga?1:0})});
    const mc=Object.entries(C).sort((a,b)=>b[1].p/b[1].n-a[1].p/a[1].n||b[1].gd-a[1].gd)[0];

function scReport(p,sc){_thr={};const e=Math.max(.35,(20-sc.jdg)/9);const ca=Math.round((ability(p)+gauss()*e)*2)/2,pt=Math.round((p.pot+gauss()*e*1.4)*2)/2;
  let best=p.pos,bv=-99;POSL.forEach(x=>{if((x==='GK')!==(p.pos==='GK'))return;const v=roleRating(p,x)+gauss()*e*.5;if(v>bv){bv=v;best=x}});
  const W=PW[p.pos]||{};const ks=ATTR.filter(k=>W[k]>0).map(k=>[k,p.a[k]+gauss()*e]).sort((a,b)=>b[1]-a[1]);
  const band=v=>v>=15?'cemerlang':v>=12?'baik':v>=9?'sederhana':'lemah';
  const str=ks.slice(0,3).map(([k,v])=>[k,band(v)]),weak=ks.slice(-2).map(([k,v])=>[k,band(v)]);
  const val=r1k(valueOf(p)*(1+gauss()*.06*e)),c=S.clubs[S.user],thr=top11Threshold(S.user),diff=ca-thr;

  const fit=diff>=1?'Boleh terus jadi pilihan utama':diff>=-.5?'Bersaing untuk tempat utama':diff>=-2?'Pemain rotasi yang berguna':'Di bawah standard skuad kau';
  const sco=diff+(pt-ca)*.3-(val>c.tb?1.5:0),rec=sco>=1.2?'Disyorkan membeli':sco>=0?'Boleh dipertimbangkan':'Tidak disyorkan';
  return{ca,pt,best,str,weak,val,fit,tac:slots.includes(best)?`Posisi ${best} ada dalam formasi ${S.lu.form}`:`Posisi ${best} tiada dalam formasi ${S.lu&&S.lu.form||''} sekarang`,rec,over:val>c.tb,acc:sc.jdg>=14?'Tinggi':sc.jdg>=9?'Sederhana':'Rendah',d:curDate()}}
function scFinish(t){const sc=S.scouts.find(s=>s.id===t.sid);if(!sc){t.st='x';return}
  if(t.k==='p'){const p=S.players[t.pid];if(!p){t.st='x';return}t.rep=scReport(p,sc);t.st='done';inbox('scout',`Laporan scout: ${p.name}`,`${sc.name} selesai memantau ${p.name}. Anggaran CA ${t.rep.ca}, potensi ${t.rep.pt}. ${t.rep.rec}.`,{links:[['scouting','Buka Scouting']],pl:p.id})}
  else{const e=(20-sc.fnd)/5;const seen=new Set();S.scT.forEach(x=>{if(x.k==='f'&&x.rep)x.rep.list.forEach(id=>seen.add(id))});
    const pool=Object.values(S.players).filter(q=>q.club!==S.user&&!q.loan&&!seen.has(q.id)&&q.age<=t.maxAge&&(!t.pos||q.pos===t.pos||(q.alt||[]).includes(t.pos)));

function achMatch(fx){if(!S.user||!fx.played||fx.comp==='FR')return;const me=S.user,home=fx.h===me,gf=home?fx.hg:fx.ag,ga=home?fx.ag:fx.hg,res=userRes(fx);
  const A=S.achS||(S.achS={ws:0,cs:0,gs:{},sc:0,sk:S.season});if(A.sk!==S.season){A.sk=S.season;A.sc=0}
  A.ws=res>0?A.ws+1:0;if(A.ws>=8)achGive('streak',`${A.ws} kemenangan berturut-turut.`);

  Object.keys(A.gs).forEach(id=>{if(!sc.has(id))delete A.gs[id]});sc.forEach(id=>{A.gs[id]=(A.gs[id]||0)+1;if(A.gs[id]>=10&&S.players[id])achGive('gm',`${S.players[id].name} menjaring dalam ${A.gs[id]} perlawanan berturut-turut.`)});

function expPts(me,o,home){return clamp(1.365+.33*(clubStrength(me)-clubStrength(o))+home*.14,.3,2.6)}
function confAfterMatch(fx){const me=S.user;if(!me||!S.job||(fx.h!==me&&fx.a!==me))return;const o=fx.h===me?fx.a:fx.h;const gf=fx.h===me?fx.hg:fx.ag,ga=fx.h===me?fx.ag:fx.hg;

function jobOffer(id){return S.job&&S.job.offers.find(o=>o.id===id)}
function leaveClub(kind){const cid=S.user;if(!cid)return null;const c=S.clubs[cid];const J=S.job;const h=J.hist[J.hist.length-1];if(h&&h.cid===cid){h.to=S.season;h.end=kind}
  c.mgr=mgrName();S.user=null;S.lu=null;S.sp=null;S.offers=[];S.negs={};S.listed={};S.loanList={};S.tr=trDefault();

function rescueClubs(old){const P=clubP(S.clubs[old]);const all=[1,2,3].flatMap(l=>S.lg[l]).filter(id=>id!==old);
  let lower=all.filter(id=>clubP(S.clubs[id])<P).sort((a,b)=>clubP(S.clubs[b])-clubP(S.clubs[a]));if(lower.length<3)lower=all.sort((a,b)=>clubP(S.clubs[a])-clubP(S.clubs[b])).slice(0,8);
  return shuffle(lower.slice(0,8)).slice(0,ri(2,3))}

  const opts=rescueClubs(old);opts.forEach(cid=>addJobOffer(cid,'rescue',S.over?null:4));UI.sacked={old,reason,opts};UI.view='jobs'}

function takeJob(cid){S.fans=55;setTimeout(()=>{try{wageReview(null)}catch(e){}},0);const J=S.job;if(S.user&&S.user!==cid){const prev=S.user;leaveClub('berpindah');J.rep=clamp(J.rep+2,0,100);const h=J.hist[J.hist.length-1];if(h&&h.cid===prev)h.end='berpindah'}
  const c=S.clubs[cid];const oldMgr=c.mgr;c.mgr=S.manager;S.user=cid;J.jobless=null;J.since=S.over?S.season+1:S.season;J.ctr=J.since+1;J.conf=60;J.warn=0;J.ult=null;
  J.hist.push({cid,name:c.name,from:J.since,to:null});J.offers=[];if(S.vac[cid])delete S.vac[cid];
  S.offers=[];S.negs={};S.listed={};S.loanList={};S.lu=null;S.sp=null;S.tr=trDefault();ensureTac();resetFam();setUserAuto(curTac().form);S.lu.ment=curTac().ment;spAutoFill();ensureStaff(cid);if(!S.over)setObjectives();

function acceptJob(id){const o=jobOffer(id);if(!o)return 'Tawaran tidak lagi sah.';if(o.exp!=null&&S.t>=o.exp)return 'Tawaran sudah tamat.';

function declineJob(id){const o=jobOffer(id);if(!o)return;S.job.offers=S.job.offers.filter(x=>x.id!==id);if(o.kind==='mid'&&S.vac[o.cid])fillVacancy(o.cid)}

function jobEligible(c){const J=S.job;if(!J||!c||!c.tier||c.id===S.user)return false;if(J.jobless)return repReq(c)<=J.rep+10;return repReq(c)<=J.rep&&clubP(c)>clubP(curClub())+3}
function openVacancy(cid,why){const c=S.clubs[cid];if(!c||S.vac[cid]||cid===S.user)return;const old=c.mgr;
  if(jobEligible(c)&&R()<(S.job.jobless?.9:.55)){S.vac[cid]={until:S.t+4,old};c.mgr='Pengurus sementara';
    inbox('league',`${c.name} ${why==='dipecat'?'pecat':'kehilangan'} pengurus`,`${old} ${why==='dipecat'?'dipecat selepas keputusan mengecewakan':'meninggalkan kelab'}. Kelab sedang mencari pengganti.`,{read:true,market:1});addJobOffer(cid,'mid',4)}

function aiMgrMarket(){let n=0;const L=[];[1,2,3].forEach(l=>{const tbl=leagueTable(l);if(!tbl.length||tbl[0].p<8)return;const exp=S.lg[l].slice().sort((a,b)=>clubStrength(b)-clubStrength(a));
    tbl.forEach((r,i)=>{const gap=i-exp.indexOf(r.id);if(r.id!==S.user&&!S.vac[r.id]&&gap>=5)L.push(r.id)})});
  shuffle(L).forEach(cid=>{if(n<2&&R()<.22){n++;openVacancy(cid,'dipecat')}});
  if(S.job&&S.job.jobless&&!S.job.offers.some(o=>o.kind==='mid'||o.kind==='rescue')&&R()<.6){const cands=[1,2,3].flatMap(l=>S.lg[l]).filter(id=>jobEligible(S.clubs[id])&&!S.vac[id]);if(cands.length)openVacancy(pick(cands),R()<.6?'dipecat':'pergi')}}

  if(nx&&monthKey(nx.d)!==monthKey(prevE.d))aiMgrMarket();
  else if(J.jobless&&R()<.25)aiMgrMarket();
  const c=curClub();if(!c)return;
  if(c.bal<0){J.conf=clamp(J.conf-(c.bal<-300000?1.2:.4),0,100)}
  if(nx&&(monthKey(nx.d).endsWith('-03')||monthKey(nx.d).endsWith('-05'))&&monthKey(nx.d)!==monthKey(prevE.d)&&J.ctr<=S.season&&!J.offers.some(o=>o.kind==='renew')){
    if(J.conf>=45)addJobOffer(S.user,'renew',null);else inbox('job','Kontrak belum disambung',`Kontrak kau tamat hujung musim ini. Lembaga belum bersedia menawarkan kontrak baharu dengan tahap kepercayaan ${Math.round(J.conf)}/100.`)}}
function jobSeasonEnd(rec){const J=S.job;if(!J)return;
  if(S.user){const c=curClub();const ev=objStatus();const msgs=[];let dc=0;
    ev.forEach(o=>{const ok=o.st==='ok';const w={lg:12,fa:4,fin:5,youth:3}[o.k];if(o.k==='lg'){const pos=rec.user.pos;const miss=pos-J.obj.lg;dc+=ok?w:miss>6?-20:-w}else dc+=ok?w:-Math.round(w*.75);msgs.push(`${ok?'✓':'✗'} ${o.l}`)});
    if(rec.up.some(x=>x[0]===S.user))dc+=10;if(rec.ch[rec.user.l]===S.user)dc+=8;if(rec.down.some(x=>x[0]===S.user))dc-=15;J.conf=clamp(J.conf+dc,0,100);
    const exp=S.lg[rec.user.l].slice().sort((a,b)=>clubStrength(b)-clubStrength(a)).indexOf(S.user)+1;let dr=clamp((exp-rec.user.pos)*1.2,-8,10);

    if(J.ult){const played=5-J.ult.left;if(played>0&&J.ult.pts<J.ult.target*played/5)sackUser(`Kau gagal mencapai sasaran kata dua sebelum musim tamat (${J.ult.pts} mata dalam ${played} perlawanan).`);else{J.ult=null;J.warn=0}}

function boardRequest(k){let xs=0;if(String(k).startsWith('stad|')){xs=+String(k).split('|')[1];k='stad'}const c=curClub();const J=S.job;if(!c)return{ok:false,msg:'Tiada kelab.'};const d=curDate();

  if(k==='tb'||k==='wb'){if(k==='wb'){const q=J.req.wbn&&J.req.wbn[0]===S.season?J.req.wbn:[S.season,0];if(q[1]>=2)return{ok:false,msg:'Had gaji hanya boleh diminta dua kali semusim.'};q[1]++;J.req.wbn=q}else{if(J.req[k]===S.season)return{ok:false,msg:'Permintaan ini hanya boleh dibuat sekali semusim.'};J.req[k]=S.season}

function amAdvice(fx){const c=curClub();if(!c||!c.staff)return '';const am=c.staff.am;if(!am)return `<div class="box"><span class="lbl">Penolong pengurus</span><p class="mute" style="font-size:.86rem">Jawatan kosong. Lantik penolong pengurus di halaman Staf untuk mendapat nasihat sebelum perlawanan.</p></div>`;
  const o=opp(fx);const tips=[];const lu=S.lu;const slots=FORMS[lu.form];
  const tired=lu.xi.filter(Boolean).map(id=>S.players[id]).filter(p=>p.cond<80).sort((a,b)=>a.cond-b.cond);if(tired.length)tips.push(`${tired.slice(0,3).map(p=>`${esc(p.name)} (${p.cond}%)`).join(', ')} kelihatan letih. Pertimbangkan untuk berehatkan mereka.`);
  const oop=lu.xi.map((id,i)=>id?[S.players[id],slots[i][0]]:null).filter(x=>x&&fam(x[0],x[1])<.9);if(oop.length)tips.push(`${oop.slice(0,2).map(([p,pos])=>`${esc(p.name)} di ${pos}`).join(', ')} bermain di luar posisi asal.`);
  const ai=autoLineup(o,S.clubs[o].form);const star=ai.xi.filter(Boolean).map(id=>S.players[id]).sort((a,b)=>ability(b)-ability(a))[0];if(star)tips.push(`Awasi ${esc(star.name)} (${star.pos}), pemain paling berbahaya ${esc(S.clubs[o].name)}.`);
  const d=clubStrength(S.user)-clubStrength(o)+(fx.neutral?0:fx.h===S.user?.3:-.3);tips.push(d>.8?'Kita lebih kuat. Mentaliti Gung Ho boleh beri tekanan awal.':d<-.8?'Lawan lebih kuat. Mentaliti Bertahan lebih selamat untuk curi mata.':'Perlawanan seimbang. Mentaliti Balanced disyorkan.');
  const sp=userSP();if(sp.pen&&!lu.xi.includes(sp.pen))tips.push(`Pengambil penalti pilihan, ${esc(pname(sp.pen))}, tiada dalam kesebelasan utama.`);
  const n=am.r>=14?5:am.r>=9?3:2;return `<div class="box"><span class="lbl">Nasihat ${esc(am.name)} · penolong pengurus (${am.r}/20)</span><ul class="tips">${tips.slice(0,n).map(t=>`<li>${t}</li>`).join('')}</ul></div>`}

   <div class="when"><div class="date">${fmtDate(curDate(),'long')}</div>${S.over?'<b>Musim tamat</b> · Terima tawaran untuk musim depan':`${J.offers.length} tawaran aktif`}</div>
   ${S.ended?'<button class="btn primary" data-act="newgame">Kerjaya baharu</button>':S.over?'<button class="btn primary" data-act="nav" data-arg="jobs">Lihat tawaran</button>':'<button class="btn primary" data-act="go">Teruskan</button>'}</header>`;

function vEnded(){const J=S.job;const tr=S.trophies||[];return `<div class="view"><section class="panel"><h2>Kerjaya ${esc(S.manager)} tamat</h2><p class="mute">${S.seasonNo} musim, ${J.hist.length} kelab. Reputasi akhir ${J.rep}/100.</p>

function trIndLabel(pid){const i=S.tr.ind[pid];if(!i)return '<span class="mute">Tiada</span>';if(i.a)return esc(ATTR_NAME[i.a]);return `Posisi ${i.pos} <span class="mute">${Math.min(99,Math.round((i.prog||0)/16*100))}%</span>`}
function vTrain(){const c=curClub();const tr=S.tr;const avgQ=['am','fit','att','def','gk'].reduce((a,k)=>a+trainQ(staffR(k)),0)/5;
  const ps=[...c.players.map(id=>S.players[id]),...(UI.trRes?(c.res||[]).map(id=>S.players[id]):[])].filter(Boolean).sort((a,b)=>POSL.indexOf(a.pos)-POSL.indexOf(b.pos)||a.age-b.age);
  return `<div class="view"><div class="row sp"><h2>Latihan</h2><span class="mono mute">Padang latihan tahap ${c.fac.train}/5 · Kualiti ${Math.round(avgQ*100)}%</span></div>
   <section class="panel"><h3>Fokus pasukan</h3><div class="tropts">${Object.entries(TR_FOCUS).map(([k,[l,d]])=>`<button class="tropt ${tr.focus===k?'on':''}" data-act="trfocus" data-arg="${k}"><b>${l}</b><span>${d}</span></button>`).join('')}</div></section>
   <div class="grid2"><section class="panel"><h3>Intensiti</h3><div class="tropts three">${Object.entries(TR_INT).map(([k,[l,d]])=>`<button class="tropt ${tr.int===k?'on':''}" data-act="trint" data-arg="${k}"><b>${l}</b><span>${d}</span></button>`).join('')}</div></section>
    <section class="panel"><h3>Kualiti jurulatih</h3>${['am','fit','att','def','gk'].map(k=>{const s=c.staff[k];return `<div class="qrow"><span>${STAFF_R[k]}</span><span class="mute nmx">${s?esc(s.name):'Kosong'}</span><b class="num">${s?s.r:'–'}</b>${meter((s?s.r:0)*5)}</div>`}).join('')}
     <div class="row"><button class="btn sm" data-act="nav" data-arg="staff">Urus staf</button><button class="btn sm" data-act="nav" data-arg="board">Naik taraf padang latihan</button></div></section></div>
   <section class="panel"><div class="row sp"><h3>Fokus individu</h3><div class="tabs"><button class="${!UI.trRes?'on':''}" data-act="trres" data-arg="0">Skuad utama</button><button class="${UI.trRes?'on':''}" data-act="trres" data-arg="1">+ Pelapis</button></div></div>
    <p class="mute" style="font-size:.86rem">Pilih satu atribut untuk diberi tumpuan, atau latih pemain untuk posisi baharu. Pemain muda berkembang paling cepat, dan pemain yang sudah mencapai potensi hampir tidak meningkat lagi.</p>
    <div class="tbl"><table><thead><tr><th>Nama</th><th>Pos</th><th class="r">Umur</th><th class="r">CA</th><th>Kondisi</th><th>Fokus individu</th></tr></thead><tbody>
    ${ps.map(p=>`<tr><td class="nm">${plink(p.id)} ${starsHTML(p)} ${p.res?'<span class="chip res">PELAPIS</span>':''}</td><td>${posHTML(p)}</td><td class="r num">${ageOf(p)}</td><td class="r num">${ability(p).toFixed(1)}</td><td>${condHTML(p.cond)}</td><td><button class="btn sm" data-act="trind" data-arg="${p.id}">${trIndLabel(p.id)}</button></td></tr>`).join('')}</tbody></table></div></section>
   <section class="panel"><h3>Perkembangan terkini</h3>${tr.log.length?`<div class="tbl"><table><tbody>${tr.log.slice(0,15).map(([d,pid,k])=>`<tr><td class="num mute">${fmtDate(d)}</td><td class="nm">${plink(pid)}</td><td>${k.startsWith('pos:')?`Kini boleh main ${k.slice(4)}`:`${ATTR_NAME[k]} <span style="color:var(--win)">+1</span>`}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">Belum ada peningkatan. Laporan latihan bulanan dihantar ke inbox.</p>'}</section></div>`}
function mTrInd(pid){const p=S.players[pid];if(!p)return;const cur=S.tr.ind[pid]||{};
  const groups=ATTR_GROUPS.filter(([n])=>n!=='Goalkeeping'||p.pos==='GK');const pos=POSL.filter(x=>x!==p.pos&&!p.alt.includes(x)&&(x==='GK')===(p.pos==='GK'));
  openModal(`<header><div><span class="lbl">Fokus individu</span><h2>${esc(p.name)} <span class="pos ${PGROUP[p.pos]}">${p.pos}</span></h2></div><button class="btn sm" data-act="close">Tutup</button></header>
   <div class="row"><button class="btn sm ${!cur.a&&!cur.pos?'good':''}" data-act="trset" data-arg="${pid}|">Tiada fokus</button></div>
   ${groups.map(([n,ks])=>`<div><span class="lbl">${n}</span><div class="fbtns" style="margin-top:4px">${ks.map(k=>`<button class="btn sm ${cur.a===k?'good':''}" data-act="trset" data-arg="${pid}|a:${k}">${ATTR_NAME[k]} <span class="mono mute">${p.a[k]}</span></button>`).join('')}</div></div>`).join('')}
   ${pos.length?`<div><span class="lbl">Latih posisi baharu</span><div class="fbtns" style="margin-top:4px">${pos.map(x=>`<button class="btn sm ${cur.pos===x?'good':''}" data-act="trset" data-arg="${pid}|pos:${x}">${x} <span class="mono mute">${Math.round(fam(p,x)*100)}%</span></button>`).join('')}</div></div>`:''}
   <p class="mute" style="font-size:.84rem">Latihan posisi baharu mengambil beberapa bulan dan bergantung pada penolong pengurus. Peratus di sebelah posisi ialah keselesaan semasa.</p>`)}

function profDefault(){return{born:S.season-35,origin:'',form:'4-4-2'}}
function ensureTac(){if(!S.prof)S.prof=profDefault();if(!S.tac){const f=(S.lu&&S.lu.form)||S.prof.form||'4-4-2';S.tac={act:0,list:TAC_PRESET.map(t=>Object.assign({form:f},t))};if(S.lu)S.tac.list[0].ment=S.lu.ment||'S'}
  if(S.job&&!S.job.wdl)S.job.wdl=[0,0,0]}
function curTac(){ensureTac();return S.tac.list[S.tac.act]}
function applyTactic(i){ensureTac();S.tac.act=i;const t=S.tac.list[i];if(!S.lu)return;S.lu.ment=t.ment;if(t.form!==S.lu.form)remapXI(t.form)}
function tacMods(m,s){const sd=m.sides[s];const t=sd.tac;const o={att:1,def:1,mid:1,drain:1,crn:1};if(!t)return o;const act=activeOn(m,s);
  const avg=(k,f)=>{const L=act.filter(f);return L.length?L.reduce((a,e)=>a+S.players[e.id].a[k],0)/L.length:10};
  if(t.line==='H'){o.mid*=1.03;o.def*=1+(avg('pac',e=>DEFP.includes(e.pos))-11)*.006-.02}else if(t.line==='L'){o.def*=1.035;o.att*=.97}
  if(t.press==='H'){o.mid*=1.02+(avg('sta',e=>e.pos!=='GK')-10)*.003;o.drain*=1.15}else if(t.press==='L'){o.mid*=.975;o.drain*=.9;o.def*=1.01}
  if(t.tempo==='H'){o.att*=1.03;o.mid*=.985;o.drain*=1.05}else if(t.tempo==='L'){o.att*=.975;o.mid*=1.025}
  if(t.width==='H'){o.att*=1.015;o.crn*=1.2;o.def*=.99}else if(t.width==='L'){o.def*=1.015;o.att*=.99;o.crn*=.85}
  if(t.pass==='H'){o.att*=1.01+(avg('str',e=>e.pos!=='GK'&&CW[e.pos][2]>.8)-10)*.003;o.mid*=.975}else if(t.pass==='L'){o.mid*=1.01+(avg('tec',e=>e.pos!=='GK')-10)*.003;o.att*=.99}

// saveFlush() menulis serta-merta; dipanggil sebelum membaca slot, ketika tab disembunyikan atau ditutup, dan oleh ujian.

function saveFlush(){if(SV.timer){clearTimeout(SV.timer);SV.timer=0}if(!SV.dirty)return;SV.dirty=false;
  const err=saveSlot('auto');if(!S||!S.user)return;if(err)saveWarn(err);else saveWarnClear()}

try{addEventListener('pagehide',saveFlush);addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveFlush()})}catch(e){}
function loadSlot(slot){saveFlush();try{return unpack(backupPre2(slot,localStorage.getItem(skey(slot))))}catch(e){return null}}
function loadSlotR(slot){saveFlush();try{return parseSave(backupPre2(slot,localStorage.getItem(skey(slot))))}catch(e){return{err:'Simpanan tidak dapat dibaca.'}}}
// Sandaran sekali sahaja sebelum simpanan format lama (sv<2) dibuka dan dinaikkan oleh 2.0.
function backupPre2(slot,raw){try{if(raw&&raw[0]!=='F'&&!localStorage.getItem('pk3-backup-pre2')){const r=parseSave(raw);if(r.s&&(r.s.sv||1)<SCHEMA)localStorage.setItem('pk3-backup-pre2',raw)}}catch(e){}return raw}
function delSlot(slot){saveFlush();try{localStorage.removeItem(skey(slot))}catch(e){}const m=getMeta();delete m[slot];setMeta(m)}
function migrateLegacy(){try{const t=localStorage.getItem(LEGACY_KEY);if(t&&!localStorage.getItem(skey('auto'))){const s=unpack(t);if(s){localStorage.setItem(skey('auto'),t);const c=s.clubs[s.user];const m=getMeta();m.auto={club:c.name,kit:c.kit,mgr:s.manager,lg:c.tier,season:s.season,no:s.seasonNo,d:s.tl[Math.min(s.t,s.tl.length-1)].d,ts:Date.now(),ver:'Beta 0.3'};setMeta(m)}}if(t)localStorage.removeItem(LEGACY_KEY)}catch(e){}}
function storageKB(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('pk3-'))n+=(localStorage.getItem(k)||'').length*2}}catch(e){}return Math.round(n/1024)}
function pruneForSave(){Object.values(S.fixtures).forEach(f=>{if(f.played&&f.h!==S.user&&f.a!==S.user&&f.t<S.t-6){delete f.st;f.rt=f.rt&&f.rt.map(side=>side.filter(x=>x[1]>=7||x[3]))}});S.inbox=S.inbox.slice(0,120);S.tlog=S.tlog.slice(0,100)}
function loadState(s){const prev=S;try{S=s;ensureState()}catch(e){S=prev;throw e}LIVE=null;UI.hist=[];UI.lastKey=null;UI.calOff=0;UI.screen='game';UI.view='home';UI.inboxSel=null;UI.clubView=null;UI.lgView=null;UI.delAsk=null;closeModal();render();window.scrollTo(0,0);celSoon()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function kitSt(cid){const c=S.clubs[cid];return c?`--k1:${c.kit[0]};--k2:${c.kit[1]}`:''}
function kit(cid,lg){return cid&&S.clubs[cid]?`<span class="kit${lg?' lg':''}" style="${kitSt(cid)}"></span>`:''}
function cname(cid){return cid&&S.clubs[cid]?S.clubs[cid].name:'Ejen bebas'}

function pname(pid,fb){return S.players[pid]?S.players[pid].name:(S.legends&&S.legends[pid]?S.legends[pid].n:(fb||'(bersara)'))}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function formHTML(f){return `<span class="form">${f.map(x=>`<i class="${x}">${x}</i>`).join('')}</span>`}
function condHTML(c){return `<span class="cond ${c<70?'bad':c<85?'warn':''}" title="Kondisi ${c}%"><span class="bar"><span style="width:${c}%"></span></span></span>`}

function sum(p,k){return p.st.L[k]+p.st.FA[k]+p.st.TB[k]}
function avgAll(p){const ap=sum(p,'ap');return ap?(sum(p,'rt')/ap).toFixed(2):'—'}
function tagChip(code,cls,title,extra){return `<span class="chip tg ${cls}" title="${esc(title)}">${code}${extra!=null?`<small>${extra}</small>`:''}</span> `}
function status(p,compact){if(!p)return '';let s='';const mine=S.user&&p.club===S.user;
  if(p.inj)s+=tagChip('INJ','r',`${injLabel(p)}, ${p.inj} hari lagi`,compact?null:p.inj+'h');
  if(p.rest>0)s+=tagChip('RHT','b',`Bercuti rehat, ${p.rest} hari lagi`);else if(mine&&isRST(p))s+=tagChip('RST','r','Perlu rehat: kondisi '+p.cond+'%');
  if(p.intl&&p.intl.on)s+=tagChip('INT','g','Dipanggil mewakili '+(NAT_NAME[p.intl.cc||p.nat]||p.nat));
  if(p.ban)s+=tagChip('SPD','r',`Digantung ${p.ban} perlawanan`,compact?null:p.ban);
  if((mine||(S.short&&S.short[p.id]))&&p.club&&!p.loan&&!p.res&&p.ctr<=S.season&&!S.over)s+=tagChip('KTR','a','Kontrak tamat hujung musim '+seasonLabel(p.ctr));if(mine){const of=S.offers.filter(o=>o.pid===p.id);if(of.length)s+=tagChip('BID','g',of.map(o=>`${cname(o.from)}: ${o.kind==='loan'?'minta pinjam':'tawaran '+fmtRM(o.fee)}`).join(' · '));
    else if(S.wan&&S.wan[p.id]&&S.clubs[S.wan[p.id].cid])s+=tagChip('WAN','a',`Diminati ${cname(S.wan[p.id].cid)}`)}
  if(p.loan)s+=tagChip('LON','a',`Dipinjam dari ${cname(p.loan.from)} hingga ${fmtDate(p.loan.until)}`);
  if(mine&&S.listed[p.id])s+=tagChip('TRF','b','Disenaraikan untuk dijual');if(mine&&S.loanList[p.id])s+=tagChip('LOA','b','Disenaraikan untuk pinjaman');return s}
function tagLegend(){return `<div class="stleg"><span>${tagChip('INJ','r','')}cedera</span><span>${tagChip('SPD','r','')}digantung</span><span>${tagChip('RST','r','')}perlu rehat</span><span>${tagChip('RHT','b','')}cuti rehat</span><span>${tagChip('BID','g','')}ada tawaran</span><span>${tagChip('WAN','a','')}diminati kelab lain</span><span>${tagChip('LON','a','')}pemain pinjaman</span><span>${tagChip('TRF','b','')}senarai jual</span><span>${tagChip('LOA','b','')}senarai pinjam</span><span>${tagChip('KTR','a','')}kontrak tamat hujung musim</span></div>`}
function aiInterest(){if(!S.user||!S.clubs[S.user])return;if(!S.wan)S.wan={};const W=S.wan;
  Object.keys(W).forEach(pid=>{const w=W[pid];const p=S.players[pid];if(!p||p.club!==S.user||w.until<S.t||!S.clubs[w.cid])delete W[pid]});
  const ut=S.clubs[S.user].tier;const mine=S.clubs[S.user].players.map(id=>S.players[id]).filter(p=>p&&!p.loan&&!p.res);
  aiClubs().forEach(cid=>{if(Object.keys(W).length>=4)return;const c=S.clubs[cid];if(c.tier>ut||R()>.012)return;
    const tgt=mine.filter(p=>p.age<=30&&ability(p)>=clubStrength(cid)-.5&&quotaOK(cid,p)&&!W[p.id]);if(!tgt.length)return;const p=pick(tgt);
    W[p.id]={cid,since:S.t,until:S.t+ri(8,16)};const key=mine.slice().sort((a,b)=>ability(b)-ability(a)).slice(0,6).includes(p);if(!key||(S.wanMsgT!=null&&S.wanMsgT<=S.t&&S.t-S.wanMsgT<8))return;S.wanMsgT=S.t;inbox('tf',`${c.name} memantau ${p.name}`,`Scout ${c.name} dilihat menonton ${p.name} beberapa kali. Mereka mungkin menghantar tawaran bila jendela pindahan dibuka. Pemain lain yang diminati ditanda WAN dalam senarai skuad.`)})}
function natTag(p){return p.imp?`<span class="chip imp" title="${NAT_NAME[p.nat]}, ${natGroup(p.nat)==='A'?'import Asia':'import luar Asia'}">${p.nat}</span>`:''}
function expectation(cid){const c=S.clubs[cid];const r=S.lg[c.tier].slice().sort((a,b)=>clubStrength(b)-clubStrength(a)).indexOf(cid);
  return c.tier>1?(r<2?'Naik divisyen':r<5?'Saingan tempat naik':r<11?'Pertengahan carta':'Elak tangga corot'):(r<2?'Pencabar kejuaraan':r<5?'Separuh atas':r<11?'Pertengahan carta':'Elak penyingkiran')}
function opp(fx){return fx.h===S.user?fx.a:fx.h}
function potStars(p){const d=p.pot-ability(p);return p.age>23?'':d>=4?'★★★':d>=2?'★★':d>=1?'★':''}
const STAR_CUT=[.15,.45,.75,.95];let STC={k:null,c:{}};
function starCuts(t){const k=S.season+'|'+S.t+'|'+S.user;if(STC.k!==k)STC={k,c:{}};if(STC.c[t])return STC.c[t];
  const v=[];(S.lg[t]||[]).forEach(cid=>(S.clubs[cid].players||[]).forEach(id=>{const p=S.players[id];if(p&&!p.res)v.push(ability(p))}));v.sort((x,y)=>x-y);
  return STC.c[t]=v.length?STAR_CUT.map(q=>v[Math.floor(q*(v.length-1))]):[6,8,10,12]}
function starOf(v,t){let s=1;starCuts(t).forEach(x=>{if(v>=x)s++});return s}
function starRef(){return S.user?(S.clubs[S.user].tier||3):lastTier()}
function starInfo(p){const t=starRef();const ab=ability(p);const U=(!S.user||p.club===S.user)?0:scoutU();let lo,hi;
  if(U){const o=(hashN(p.id+'st')%(U+1))*.5;lo=starOf(ab-o,t);hi=starOf(ab-o+U*.5,t)}else lo=hi=starOf(ab,t);
  const pot=p.age<=23&&U<3?Math.max(hi,starOf(p.pot,t)):hi;return{lo,hi,pot,t,U}}
function starsHTML(p,cls){if(!p)return '';const s=starInfo(p);const c=(cls||'').includes('c');let h='';
  for(let i=1;i<=5;i++)h+=i<=s.lo?'<i>★</i>':i<=s.hi?'<i class="q">★</i>':i<=s.pot?'<i class="p">☆</i>':c?'':'<i class="e">☆</i>';
  const tt=`Kebolehan ${s.lo===s.hi?s.lo:s.lo+'–'+s.hi} bintang${s.pot>s.hi?`, potensi ${s.pot} bintang`:''}, berbanding pemain ${LG_NAME[s.t]}${s.U?' (anggaran scout)':''}`;
  return `<span class="st5 ${cls||''}" title="${tt}" aria-label="${tt}">${h}</span>`}
function starLegend(){return `<div class="stleg"><span><span class="st5"><i>★</i></span> kebolehan semasa</span><span><span class="st5"><i class="p">☆</i></span> potensi</span><span><span class="st5"><i class="q">★</i></span> anggaran scout</span><span>5 bintang = terbaik di ${LG_NAME[starRef()]}</span></div>`}

function shortAdd(pid,mode){const p=S.players[pid];if(!p||p.club===S.user||!mode)return;if(!S.short)S.short={};S.short[pid]={mode,season:S.season,d:curDate(),club:p.club||null}}

  const ps=S.clubs[cid].players.map(id=>S.players[id]).filter(p=>p&&!p.res);return ps.length?ps.sort((a,b)=>leadScore(b)-leadScore(a))[0].id:null}
function clubInfoHTML(c){const isU=c.id===S.user;const ps=c.players.map(id=>S.players[id]).filter(p=>p&&!p.res);
  const kv=(l,v)=>`<span class="lbl">${l}</span><b>${v}</b>`;let pos='',tbl=null;
  if(c.tier){tbl=leagueTable(c.tier);const i=tbl.findIndex(r=>r.id===c.id);const r=tbl[i];pos=`Tempat ke-${i+1} / ${tbl.length}${r&&r.p?` · ${r.pts} mata dari ${r.p} perlawanan`:' · belum bermula'}`}

  const pl=p=>`<div class="ciprow"><span class="pos ${PGROUP[p.pos]}">${p.pos}</span><span class="nmx">${plink(p.id)} ${starsHTML(p,'c')}</span><span class="mute num">${ageOf(p)} thn</span></div>`;
  return `<div class="cinfo"><section class="panel"><h3>Maklumat kelab</h3><div class="kv2">
     ${kv('Pengurus',esc(isU?S.manager:(c.mgr||'—')))}${kv('Kapten',cap?plink(cap):'—')}${kv('Stadium',`${esc(c.stadium||'—')} · ${(c.cap||0).toLocaleString('ms-MY')} tempat duduk`)}
     ${c.tier?kv('Liga',`${LG_NAME[c.tier]} · ${pos}`):kv('Liga','Kelab amatur')}${kv('Lokasi',`${esc(c.dist||'')}${c.state?', '+esc(c.state):''}`)}</div></section>
    ${c.tier?`<section class="panel"><h3>Kewangan</h3><div class="kv2">${kv('Baki',`<span style="color:${c.bal<0?'var(--loss)':'var(--fg)'}">${fmtRM(c.bal)}</span>`)}${kv('Bil gaji',fmtRM(wageBill(c.id))+'/bln')}${kv('Bajet pindahan',fmtRM(c.tb||0))}${kv('Nilai skuad',fmtRM(squadValue(c.id)))}${kv('Penaja',fmtRM(c.spons||0)+'/bln')}${kv('Harga tiket',fmtRM(c.tick||0))}</div></section>`:''}
    ${fac?`<section class="panel"><h3>Kemudahan</h3><div class="kv2">${Object.keys(FAC_NAME).map(k=>kv(FAC_NAME[k],`${facStars(fac[k])} <span class="mute num">${fac[k]}/5</span>`)).join('')}${kv('Stadium',`${(c.cap||0).toLocaleString('ms-MY')} kapasiti`)}</div></section>`:''}
    <section class="panel"><h3>Pemain utama</h3>${key.map(pl).join('')||'<p class="mute">Tiada.</p>'}</section>
    <section class="panel"><h3>Wonderkid</h3>${wk.length?wk.map(([p])=>pl(p)).join(''):'<p class="mute" style="font-size:.86rem">Tiada pemain 21 tahun ke bawah dengan potensi 4 bintang ke atas'+(isU?'.':' yang dikesan scout.')+'</p>'}</section></div>`}

// ---- musim ini
function tbStatus(cid){if(!S.tb||!S.tb.part.includes(cid))return{st:'na',txt:'Tidak dijemput musim ini',next:null};
  const nx=Object.values(S.fixtures).filter(f=>f.comp==='TB'&&!f.played&&(f.h===cid||f.a===cid)).sort((a,b)=>a.t-b.t)[0]||null;
  const F=fxOf('TB','F')[0];if(F&&F.played&&(F.h===cid||F.a===cid))return F.win===cid?{st:'ok',txt:'Juara Piala TBPM',next:null}:{st:'fail',txt:'Naib juara (tewas di final)',next:null};
  const ko=Object.values(S.fixtures).filter(f=>f.comp==='TB'&&!f.grp&&f.played&&f.win&&(f.h===cid||f.a===cid)).sort((a,b)=>b.t-a.t)[0];
  if(ko&&ko.win!==cid)return{st:'fail',txt:`Tersingkir di ${roundLabel('TB',ko.round).replace(/, Pertemuan.*/,'')}`,next:null};
  if(ko&&ko.win===cid)return{st:'pend',txt:`Mara dari ${roundLabel('TB',ko.round).replace(/, Pertemuan.*/,'')}`,next:nx};
  if(S.tb.fmt==='ko')return{st:'pend',txt:ko?`Mara dari ${roundLabel('TB',ko.round).replace(/, Pertemuan.*/,'')}`:'Menunggu Pusingan 16',next:nx};
  const g=Object.keys(S.tb.groups).find(k=>S.tb.groups[k].includes(cid));const t=tbGroupTable(g);const i=t.findIndex(r=>r.id===cid);const r=t[i];
  const gDone=fxOf('TB','G6').length&&fxOf('TB','G6').every(f=>f.played);const inKO=['QF1','SF1'].some(rd=>fxOf('TB',rd).some(f=>f.h===cid||f.a===cid));
  if(gDone&&!inKO)return{st:'fail',txt:`Tersingkir di peringkat kumpulan (tempat ke-${i+1}, Kumpulan ${g})`,next:null};
  if(inKO&&!ko)return{st:'pend',txt:`Layak ke suku akhir (Kumpulan ${g}, tempat ke-${i+1})`,next:nx};
  return{st:'pend',txt:`Kumpulan ${g}: tempat ke-${i+1}, ${r.pts} mata dari ${r.p} perlawanan`,next:nx}}
function faStatus(cid){const fr=faReach(cid);const nx=Object.values(S.fixtures).filter(f=>f.comp==='FA'&&!f.played&&(f.h===cid||f.a===cid)).sort((a,b)=>a.t-b.t)[0]||null;
  if(fr.best<0&&!nx)return{st:'pend',txt:`Belum bermula. ${roundLabel('FA','R64')} pada ${fmtDate(dateOfT(tIndex('FA','R64')),'long')}`,next:null};
  if(fr.best===6)return{st:'ok',txt:'Juara Piala FA',next:null};

// ===== 1.1: perlawanan persahabatan pra-musim, kalendar mingguan, statistik pasukan
const FR_FEE={1:15000,2:8000,3:4000};
const FR_CAT={S:['Lebih kuat','var(--loss)'],E:['Setara','var(--hot)'],W:['Lebih lemah','var(--win)']};
function teamStr(cid){const c=S.clubs[cid];const xs=(c&&c.players||[]).map(id=>S.players[id]).filter(p=>p&&!p.res).map(ability).sort((a,b)=>b-a).slice(0,11);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0}
function frMark(){if(S.tl.some(e=>e.fr))return;const P=[];S.tl.forEach((e,i)=>{if(e.k==='P')P.push(i)});P.slice(1,6).forEach((i,n)=>S.tl[i].fr=n+1)}
function frAtt(hc,aid,rnd){if(!hc||!hc.tier)return null;const r=rep(hc);const base={1:4500+r*1800,2:1800+r*900,3:700+r*330}[hc.tier];const diff=Math.max(0,hc.tier-tierOf(aid));
  return Math.round(Math.min(hc.cap,base*(.3+.4*diff+.05*repOf(aid))*(.85+rnd*.3)))}
function frMoney(o){const me=S.clubs[S.user];if(!me)return{k:'none',v:0};if(o.home){const a=frAtt(me,o.opp,.5);return a?{k:'gate',v:r1k(a*me.tick)}:{k:'none',v:0}}
  return o.cat==='W'?{k:'fee',v:FR_FEE[me.tier]||3000}:{k:'none',v:0}}
function frUnschedule(cid){Object.keys(S.fixtures).forEach(k=>{const f=S.fixtures[k];if(f.comp==='FR'&&!f.played&&(f.h===cid||f.a===cid)){const e=S.tl[f.t];if(e&&e.pre){e.k='P';delete e.c;delete e.pre}delete S.fixtures[k]}})}
function frGen(slots){const me=S.user,mt=S.clubs[me].tier||3,ms=teamStr(me);
  const all=Object.keys(S.clubs).filter(id=>id!==me&&(S.clubs[id].players||[]).length>=11);const st={};all.forEach(id=>st[id]=teamStr(id));
  const tn=id=>S.clubs[id].tier||4;const prefer=(L,f)=>{const a=L.filter(f);return a.length>=3?a:L};
  const byStr=all.slice().sort((a,b)=>st[b]-st[a]);
  let pS=prefer(all.filter(id=>st[id]>=ms+.8),id=>tn(id)<mt);if(pS.length<2)pS=byStr.slice(0,6);
  let pE=prefer(all.filter(id=>Math.abs(st[id]-ms)<.8),id=>tn(id)===mt);if(pE.length<2)pE=all.slice().sort((a,b)=>Math.abs(st[a]-ms)-Math.abs(st[b]-ms)).slice(0,6);
  let pW=prefer(all.filter(id=>st[id]<=ms-.8),id=>tn(id)>mt);if(pW.length<2)pW=byStr.slice(-6);
  const cats=shuffle(['S','E','W',...[0,1].map(()=>pick(['S','E','W']))]).slice(0,slots.length);if(slots.length<3)cats.sort(()=>R()-.5);
  const used=new Set();const P={S:pS,E:pE,W:pW};
  return slots.map((t,i)=>{const cat=cats[i]||pick(['S','E','W']);let L=P[cat].filter(id=>!used.has(id));if(!L.length)L=all.filter(id=>!used.has(id));const opp=pick(L);used.add(opp);
    return{t,n:S.tl[t].fr,opp,cat,home:R()<({S:.6,E:.5,W:.4})[cat]}})}
function frEnsure(){if(!S||!S.user||S.over||S.ended||!S.tl)return;frMark();let F=S.fr;
  if(F&&F.season===S.season&&F.cid===S.user){if(!F.done){F.opts=F.opts.filter(o=>o.t>=S.t&&S.tl[o.t]&&S.tl[o.t].k==='P');F.min=Math.min(3,F.opts.length);if(!F.opts.length)F.done=true}return}
  if(F&&F.season===S.season&&F.cid&&F.cid!==S.user)frUnschedule(F.cid);
  const slots=S.tl.map((e,i)=>e.fr&&e.k==='P'&&i>=S.t?i:-1).filter(i=>i>=0);
  if(!slots.length){S.fr={season:S.season,cid:S.user,opts:[],sel:[],done:true,min:0};return}
  const opts=frGen(slots);S.fr={season:S.season,cid:S.user,opts,sel:[],done:false,min:Math.min(3,opts.length)};UI.frSel=[];
  inbox('match','Tawaran perlawanan persahabatan pra-musim',`${opts.length} kelab menawarkan perlawanan persahabatan sebelum ${LG_NAME[S.clubs[S.user].tier]} bermula: ${opts.map(o=>S.clubs[o.opp].name).join(', ')}. Pilih sekurang-kurangnya ${S.fr.min}. Tarikh sudah ditetapkan dalam kalendar. Kelab lebih kuat yang datang ke laman sendiri menarik lebih ramai penonton dan menambah kutipan tiket.`,{links:[['@fropen','Pilih perlawanan persahabatan']]})}
function frPending(){const F=S.fr;return !!(S.user&&F&&!F.done&&F.cid===S.user&&F.opts.length)}
function mFriendly(){const F=S.fr;if(!F||F.done){closeModal();return}if(!UI.frSel)UI.frSel=[];const sel=UI.frSel;const me=S.clubs[S.user];
  openModal(`<header><div><span class="lbl">Pra-musim ${seasonLabel(S.season)}</span><h2>Perlawanan persahabatan</h2></div><button class="btn sm" data-act="close">Tutup</button></header>
   <p class="mute" style="font-size:.88rem">Pilih sekurang-kurangnya ${F.min} daripada ${F.opts.length} tawaran. Tarikh sudah ditetapkan, seminggu antara setiap perlawanan. Perlawanan persahabatan tidak dikira dalam statistik pemain, rekod atau kepercayaan lembaga, dan kad tidak membawa penggantungan. Pemain masih boleh cedera.</p>
   <div class="frlist">${F.opts.map((o,i)=>{const c=S.clubs[o.opp];const on=sel.includes(i);const mny=frMoney(o);const ct=FR_CAT[o.cat];
     return `<button class="fropt ${on?'on':''}" data-act="frtog" data-arg="${i}" aria-pressed="${on}"><span class="frck">${on?'✓':''}</span>

      <span class="frc"><span class="frn">${kit(o.opp)} <b>${esc(c.name)}</b></span><span class="mute">${c.tier?LG_NAME[c.tier]:'Kelab amatur'} · ${esc(o.home?me.stadium:(c.stadium||c.name))}</span></span>
      <span class="frx"><span class="chip" style="color:${ct[1]};border-color:currentColor">${ct[0]}</span><span class="num ${mny.v?'plus':'mute'}" style="font-size:.8rem">${mny.k==='gate'?'Anggaran tiket '+fmtRM(mny.v):mny.k==='fee'?'Yuran penampilan '+fmtRM(mny.v):'Tiada pendapatan'}</span></span></button>`}).join('')}</div>
   <div class="row sp"><span class="mono">Dipilih ${sel.length}/${F.opts.length} · minimum ${F.min}</span><div class="row"><button class="btn" data-act="frauto">Pilih automatik</button><button class="btn primary" data-act="frok" ${sel.length<F.min?'disabled':''}>Sahkan jadual</button></div></div>`)}
function frConfirm(){const F=S.fr;const ids=(UI.frSel||[]).slice().sort((a,b)=>a-b);if(!F||F.done||ids.length<F.min)return;

function frHomePanel(){const F=S.fr;if(frPending())return `<section class="panel frcall"><div class="row sp"><h3>Tawaran perlawanan persahabatan</h3><span class="chip sale">Perlu tindakan</span></div><p>${F.opts.length} kelab menawarkan perlawanan persahabatan pra-musim. Pilih sekurang-kurangnya ${F.min} sebelum meneruskan.</p><div class="row"><button class="btn primary" data-act="fropen">Pilih perlawanan</button></div></section>`;

// ---- kalendar mingguan (Skuad)
function mondayOf(d){return addDays(d,-((dow(d)+6)%7))}
function weekStrip(){const cur=curDate();const first=S.tl[0].d,last=S.tl[S.tl.length-1].d;const m0=mondayOf(cur);
  const minO=Math.round(daysBetween(m0,mondayOf(first))/7),maxO=Math.round(daysBetween(m0,mondayOf(last))/7);const off=clamp(UI.calOff||0,minO,maxO);UI.calOff=off;
  const mon=addDays(m0,off*7);const byD={};S.tl.forEach((e,i)=>{(byD[e.d]=byD[e.d]||[]).push(i)});let h='';
  for(let k=0;k<7;k++){const d=addDays(mon,k);const idx=byD[d]||[];const isCur=d===cur&&!S.over;const past=d<cur||(S.over&&d===cur);let body='',match=false,wc='';
    for(const i of idx){const e=S.tl[i];const fx=fixturesAt(i).find(f=>f.h===S.user||f.a===S.user);
      if(fx){match=true;wc=fx.comp;const o=opp(fx);const ha=fx.neutral?'N':fx.h===S.user?'H':'A';let res='';
        if(fx.played){const g=fx.h===S.user?fx.hg:fx.ag,x=fx.h===S.user?fx.ag:fx.hg;const r=fx.win?(fx.win===S.user?'M':'K'):(g>x?'M':g<x?'K':'S');res=`<button class="link wres ${r}" data-act="report" data-arg="${fx.id}">${r} ${g}-${x}</button>`}
        body+=`<span class="wtop">${compChip(fx.comp)}<span class="wha ${ha}">${ha}</span>${isDerby(fx)?'<span class="chip derby">DERBI</span>':''}</span><span class="wopp">${kit(o)} <button class="link" data-act="club" data-arg="${o}">${esc(S.clubs[o].name)}</button></span>${res}`}
      else if(e.k==='M')body+=`<span class="wtop">${compChip(e.c[0])}</span><span class="mute">Tiada perlawanan untuk kelab kau</span>`;
      else if(e.k==='B')body+='<span class="mute">Rehat antarabangsa</span>';
      else body+=`<span class="mute">${e.fr&&frPending()?'Slot persahabatan':'Pra-musim'}</span>`}
    if(!body){const lg1=(S.tl.find(x=>x.c&&x.c[0]==='L')||{}).d;body=`<span class="mute">${d<first?'Persediaan musim':d>last?'Cuti musim':dow(d)===0?'Hari rehat':lg1&&d<lg1?'Latihan pra-musim':'Latihan'}</span>`}
    h+=`<div class="wk ${isCur?'cur':''} ${past&&!isCur?'past':''} ${match?'':'off'} ${wc?'c-'+wc+' k-'+wc:''}"><span class="wd">${DAYS[dow(d)]}, ${fmtDate(d)}${isCur?' · kini':''}</span>${body}</div>`}
  return `<section class="panel wstrip"><div class="row sp"><h3>Kalendar mingguan</h3><div class="row" style="gap:6px"><button class="btn sm" data-act="calweek" data-arg="-1" ${off<=minO?'disabled':''} aria-label="Minggu sebelum">‹</button><span class="mono" style="font-size:.84rem;min-width:118px;text-align:center">${fmtDate(mon)} – ${fmtDate(addDays(mon,6))}</span><button class="btn sm" data-act="calweek" data-arg="1" ${off>=maxO?'disabled':''} aria-label="Minggu seterusnya">›</button>${off?'<button class="btn sm" data-act="calweek" data-arg="0">Minggu ini</button>':''}</div><button class="btn sm" data-act="nav" data-arg="fixtures">Kalendar penuh</button></div>
   <div class="wrow cal7">${h}</div><span class="mute" style="font-size:.78rem">H = laman sendiri · A = tempat lawan · N = tempat neutral</span></section>`}

// ---- statistik pasukan (Utama)
function homeStats(){const me=S.user;if(!me)return '';const all=Object.values(S.fixtures).filter(f=>f.played&&(f.h===me||f.a===me)).sort((a,b)=>a.t-b.t);
  const fx=all.filter(f=>f.comp!=='FR'),fr=all.filter(f=>f.comp==='FR');const n=fx.length;
  const res=f=>{const s=f.h===me?0:1;const g=s?f.ag:f.hg,x=s?f.hg:f.ag;return{s,g,x,k:f.win?(f.win===me?'M':'K'):(g>x?'M':g<x?'K':'S')}};
  let w=0,d=0,l=0,gf=0,ga=0,cs=0,po=0,xf=0,xa=0,sh=0,ot=0,ns=0;
  fx.forEach(f=>{const r=res(f);gf+=r.g;ga+=r.x;if(!r.x)cs++;if(r.k==='M')w++;else if(r.k==='S')d++;else l++;const st=f.st;if(st&&st.po){ns++;po+=st.po[r.s];xf+=st.xg[r.s];xa+=st.xg[1-r.s];sh+=st.sh[r.s];ot+=st.ot[r.s]}});
  const frR=fr.map(res);const frTxt=fr.length?`Persahabatan: M${frR.filter(r=>r.k==='M').length} S${frR.filter(r=>r.k==='S').length} K${frR.filter(r=>r.k==='K').length}`:'';

  let h=`<section class="panel hstats"><div class="row sp"><h3>Prestasi ${seasonLabel(S.season)}</h3><span class="mute" style="font-size:.78rem">Perlawanan rasmi</span></div>`;
  if(!n){h+=`<p class="mute" style="font-size:.88rem">Belum ada perlawanan rasmi musim ini.${frTxt?' '+frTxt+'.':''}</p>`+(fr.length?`<span class="lbl">Persahabatan</span><div class="hslist">${fr.slice(-5).reverse().map(row).join('')}</div>`:'')+'</section>';return h}
  const tile=(l,v,s)=>`<div class="hst"><span class="lbl">${l}</span><b class="num">${v}</b>${s?`<span class="mute">${s}</span>`:''}</div>`;

   <div class="hsgrid">${tile('Rekod',`${w}-${d}-${l}`,`${n} perlawanan · M-S-K`)}${tile('Gol',`${gf}-${ga}`,`${(gf/n).toFixed(1)} jaring, ${(ga/n).toFixed(1)} bolos`)}
    ${tile('Penguasaan purata',ns?Math.round(po/ns)+'%':'–')}${tile('Clean sheet',cs,`${Math.round(cs/n*100)}% perlawanan`)}
    ${tile('xG purata',ns?(xf/ns).toFixed(2):'–',ns?`lawan ${(xa/ns).toFixed(2)}`:'')}${tile('Percubaan',ns?(sh/ns).toFixed(1):'–',ns&&sh?`${Math.round(ot/sh*100)}% tepat sasaran`:'')}</div>`;
  const ps=S.clubs[me].players.map(id=>S.players[id]).filter(p=>p&&!p.res).map(p=>{let ap=0,rt=0,g=0,as=0;['L','FA','TB'].forEach(k=>{const s=p.st[k];if(s){ap+=s.ap;rt+=s.rt;g+=s.g;as+=s.as}});return{p,ap,rt:ap?rt/ap:0,g,as}});
  const minAp=Math.max(1,Math.min(5,Math.ceil(n/3)));const q=ps.filter(x=>x.ap>=minAp);const by=(L,f)=>L.slice().sort(f)[0];

   ${frTxt?`<p class="mute" style="font-size:.8rem;margin:0">${frTxt}</p>`:''}</section>`;return h}

  if(f.st===2)return `<div class="banner off">Tiada denda. ${esc(p?p.name:'Pemain')} hanya diberi amaran.</div>`;
  if(!p||p.club!==S.user)return '<p class="mute">Pemain ini sudah tiada di kelab. Denda tidak lagi boleh dikenakan.</p>';
  if(!fineLive(m))return `<p class="mute">Tempoh untuk mengenakan denda sudah tamat (${FINE_DAYS} hari selepas kad merah).</p>`;

 <div class="grid2">

  <section class="panel"><h3>Lembaga & kerjaya</h3><p>Halaman Lembaga menunjukkan kepercayaan lembaga, objektif musim dan kontrak kau. Keputusan buruk menurunkan kepercayaan: bawah 35 kau diberi amaran, bawah 20 kau diberi kata dua, dan gagal kata dua bermaksud dipecat. Musim pertama di setiap kelab dilindungi.</p><p>Kau boleh minta lembaga besarkan stadium, naik taraf padang latihan, akademi pelapis dan pusat perubatan, atau tambah bajet. Reputasi pengurus naik dengan kejayaan, dan kelab lain akan menghantar tawaran kerja ke inbox. Kerjaya berlangsung maksimum ${MAX_SEASONS} musim.</p></section>
  <section class="panel"><h3>Latihan & staf</h3><p>Di halaman Latihan, pilih fokus pasukan dan intensiti. Latihan berat mempercepat perkembangan tetapi meletihkan pemain dan menaikkan risiko cedera. Fokus individu membolehkan pemain muda dilatih pada atribut tertentu atau posisi baharu.</p><p>Staf menentukan kualiti latihan, tempoh kecederaan dan ketepatan laporan scout. Gaji staf dikira dalam had gaji.</p></section>

  <section class="panel"><h3>Kad kelab</h3><p>Tekan Kad kelab di Utama untuk jana imej PNG kelab kau dan kongsi ke WhatsApp atau media sosial. Lencana boleh ditukar bentuk dan hurufnya.</p></section>
  <section class="panel"><h3>Pindahan & pinjaman</h3><p>Jendela pindahan dibuka pada pra-musim hingga pusingan ketiga liga, dan sepanjang Januari. Pembelian melalui dua langkah: yuran dengan kelab, kemudian gaji dengan pemain. Harga balas boleh diterima dengan satu klik. Pinjaman boleh dibuat untuk 6 bulan atau 1 tahun. Tawaran untuk pemain kau akan masuk ke inbox.</p></section>
  <section class="panel"><h3>Kewangan</h3><p>Baki kelab bergantung pada gaji, kos operasi, kutipan tiket, penajaan, hak siaran dan hadiah. Naik divisyen akan menaikkan semua sumber pendapatan. Jika baki jatuh negatif, lembaga akan membekukan bajet pindahan.</p></section>

// Tempat Asia dari liga (spec A1: 4 tempat ACL + 1 melalui Piala FA, tempat 5-6 ke AL). Ubah di sini jika Zonan mahu 2+...
const ASIA_SLOTS={acl:4,al:2};
// Label J/R/ACL/AL/N dikira dengan matematik mata maksimum: hanya dipaparkan bila kedudukan sudah TIDAK boleh berubah.
function tableLabels(l,t){const out={};const N=t.length,TG=38;if(N<2)return out;
  const mx=t.map(r=>r.pts+3*Math.max(0,TG-r.p));
  const fin=t.every(r=>r.p>=TG);// musim tamat: kedudukan (termasuk pemecah seri) sudah muktamad
  const lockTop=(i,n)=>fin?i<n:t.reduce((c,r,j)=>c+(j!==i&&mx[j]>=t[i].pts?1:0),0)<n;
  const lockBelow=(i,n)=>fin?i>=N-n:t.reduce((c,r,j)=>c+(j!==i&&r.pts>mx[i]?1:0),0)>=N-n;
  t.forEach((r,i)=>{
    if(lockTop(i,1)&&t.some(x=>x.p>0)){out[r.id]=['J','Juara '+LG_NAME[l]];return}
    if(l>1&&lockTop(i,3)){out[r.id]=['N','Naik divisyen'];return}
    if(l===1&&lockTop(i,ASIA_SLOTS.acl)){out[r.id]=['ACL','Layak Liga Juara-Juara Asia'];return}
    if(l===1&&lockTop(i,ASIA_SLOTS.acl+ASIA_SLOTS.al)){out[r.id]=['AL','Layak Liga Asia'];return}
    if(l<3&&lockBelow(i,3))out[r.id]=['R','Tersingkir ke divisyen bawah']});
  return out}
function labChip(x){if(!x)return '';const k={J:'c-L',N:'c-TB',ACL:'c-AC',AL:'c-AL',R:'c-FA'}[x[0]]||'';return ` <span class="chip cc lab ${k}" title="${esc(x[1])}">${x[0]}</span>`}

function sparkSVG(h){if(h.length<2)return '<p class="mute">Belum cukup data.</p>';const W=600,H=90,min=Math.min(0,...h),max=Math.max(...h),rg=(max-min)||1;

function start(data){migrateLegacy();if(data&&data.S){S=data.S;ensureState();UI.screen='game'}else{S=null;if(Object.keys(getMeta()).length)UI.screen='title';else{newWorld();UI.screen='game'}}render()}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}

// ---- hook statistik beta (versi Netlify sahaja)
(function(){const ev=(e,d)=>{try{window.PK_EVENT&&window.PK_EVENT(e,d)}catch(x){}};
  try{const _sv=save;save=function(){const r=_sv.apply(this,arguments);try{window.PK_TICK&&window.PK_TICK()}catch(x){}return r}}catch(e){}
  try{const _sk=sackUser;sackUser=function(){const c=S&&S.user&&S.clubs[S.user];const r=_sk.apply(this,arguments);ev('sacked',c?c.name:'');return r}}catch(e){}
  try{const _tj=takeJob;takeJob=function(cid){const r=_tj.apply(this,arguments);ev('jobchange',S.clubs[cid]?S.clubs[cid].name:'');return r}}catch(e){}
  try{const _se=seasonEnd;seasonEnd=function(){const r=_se.apply(this,arguments);try{const h=S.honours&&S.honours[0];if(h&&h.user){const l=h.user.l,me=h.user.cid||S.user;ev('season_end',(LG_SHORT[l]||l)+' #'+h.user.pos);
      if(h.ch&&h.ch[l]===me)ev('champion',LG_NAME[l]);const up=(h.up||[]).find(x=>x[0]===me),dn=(h.down||[]).find(x=>x[0]===me);if(up)ev('promoted',LG_NAME[up[2]]);if(dn)ev('relegated',LG_NAME[dn[2]])}
      if(S.ended)ev('career_end',S.seasonNo);
      if(S.seasonNo<=3&&window.PK_GC)window.PK_GC('musim-'+S.seasonNo+'-tamat')}catch(x){}return r}}catch(e){}
  try{const _da=doAdvance;doAdvance=function(){const n=(S&&S.trophies||[]).length;const r=_da.apply(this,arguments);try{(S.trophies||[]).slice(n).forEach(t=>{if(/Piala/.test(t.t))ev('cup',t.t)})}catch(x){}return r}}catch(e){}
})();
const boot=d=>window.PK_GATE?window.PK_GATE(()=>start(d)):start(d);
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
